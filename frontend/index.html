<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Interview Evaluator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Asli Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 transition-colors duration-300 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white dark:bg-gray-800 transition-colors duration-300 p-8 rounded-2xl shadow-xl w-full max-w-2xl border border-gray-100 dark:border-gray-700">
        
        <!-- Header, Login Toggle & Dark Mode -->
        <div class="flex justify-between items-center mb-8 border-b border-gray-100 dark:border-gray-700 pb-4">
            <div>
                <h1 class="text-2xl sm:text-3xl font-extrabold text-indigo-600 dark:text-indigo-400 mb-1">AI Interview Coach 🚀</h1>
                <p class="text-sm text-gray-500 dark:text-gray-400" id="modeStatus">Currently using: <span class="font-bold text-green-500">Guest Mode</span></p>
            </div>
            <div class="flex flex-col sm:flex-row items-end sm:items-center space-y-2 sm:space-y-0 sm:space-x-3">
                <button id="showLoginBtn" class="text-sm font-bold bg-indigo-100 dark:bg-indigo-900/50 text-indigo-700 dark:text-indigo-300 px-4 py-2 rounded-lg hover:bg-indigo-200 dark:hover:bg-indigo-800 transition-colors">
                    👤 Log In
                </button>
                <button id="logoutBtn" class="hidden text-sm font-bold bg-red-100 dark:bg-red-900/50 text-red-700 dark:text-red-300 px-4 py-2 rounded-lg hover:bg-red-200 dark:hover:bg-red-800 transition-colors">
                    🚪 Log Out
                </button>
                <button id="themeToggle" class="text-sm p-2 bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-300 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors">
                    🌙
                </button>
            </div>
        </div>

        <!-- Real Login / Auth UI -->
        <div id="loginSection" class="hidden mb-8 p-6 bg-indigo-50 dark:bg-indigo-900/20 rounded-xl border border-indigo-200 dark:border-indigo-800 shadow-inner">
            <h2 class="text-xl font-bold text-gray-800 dark:text-gray-200 mb-4">Account Access</h2>
            <p class="text-sm text-gray-600 dark:text-gray-400 mb-4">Create a new account or log in to your existing one.</p>
            
            <div class="space-y-3">
                <input type="email" id="emailInput" placeholder="Enter your Email" class="w-full p-3 border border-gray-300 dark:border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white dark:bg-gray-700 text-gray-900 dark:text-white">
                <input type="password" id="passwordInput" placeholder="Enter your Password" class="w-full p-3 border border-gray-300 dark:border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white dark:bg-gray-700 text-gray-900 dark:text-white">
                
                <div class="flex space-x-3 pt-2">
                    <button id="loginSubmitBtn" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-lg transition duration-300">
                        Log In
                    </button>
                    <button id="signupSubmitBtn" class="flex-1 bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg transition duration-300">
                        Sign Up
                    </button>
                </div>
                <button id="continueGuestBtn" class="w-full mt-2 bg-gray-200 hover:bg-gray-300 dark:bg-gray-600 dark:hover:bg-gray-500 text-gray-800 dark:text-gray-200 font-bold py-3 rounded-lg transition duration-300">
                    Cancel & Return to Guest Mode
                </button>
            </div>
            <div id="authError" class="hidden mt-3 text-red-600 text-sm font-semibold"></div>
        </div>
        
        <!-- Main Application -->
        <div id="mainApp" class="space-y-5">
            <div>
                <label class="block text-gray-700 dark:text-gray-300 font-bold mb-2">Interview Question / Topic:</label>
                <input type="text" id="topic" class="w-full p-4 border border-gray-300 dark:border-gray-600 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-white transition-colors" placeholder="e.g., Tell me about your technical projects.">
            </div>
            
            <div>
                <label class="block text-gray-700 dark:text-gray-300 font-bold mb-2">Your Answer (Transcript):</label>
                <textarea id="transcript" rows="5" class="w-full p-4 border border-gray-300 dark:border-gray-600 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-white transition-colors" placeholder="Type your detailed answer here..."></textarea>
            </div>

            <button id="evaluateBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-lg py-4 rounded-xl transition duration-300 shadow-md">
                Evaluate My Answer
            </button>
        </div>

        <div id="loading" class="hidden mt-6 text-center p-4 bg-indigo-50 dark:bg-indigo-900/30 rounded-xl border border-indigo-100 dark:border-indigo-800">
            <p class="text-indigo-600 dark:text-indigo-400 font-bold animate-pulse">⏳ AI is analyzing your response... Please wait.</p>
        </div>

        <!-- Results Section -->
        <div id="resultBox" class="hidden mt-8 p-6 bg-gradient-to-br from-green-50 to-emerald-50 dark:from-green-900/20 dark:to-emerald-900/20 rounded-xl border border-green-200 dark:border-green-800 shadow-sm">
            <h2 class="text-xl font-bold text-gray-800 dark:text-gray-200 mb-4 flex items-center">📊 Evaluation Result</h2>
            <div class="flex items-center space-x-4 mb-4">
                <div class="w-20 h-20 rounded-full bg-green-500 text-white flex items-center justify-center text-3xl font-extrabold shadow-inner" id="scoreDisplay">0</div>
                <span class="text-xl font-bold text-gray-700 dark:text-gray-300">Out of 10</span>
            </div>
            <div class="bg-white dark:bg-gray-800 p-4 rounded-lg shadow-sm border border-gray-100 dark:border-gray-700">
                <h3 class="font-bold text-gray-800 dark:text-gray-200 mb-1">Feedback:</h3>
                <p id="feedbackDisplay" class="text-gray-700 dark:text-gray-300 leading-relaxed"></p>
            </div>
        </div>
        
        <div id="errorBox" class="hidden mt-6 p-4 bg-red-50 dark:bg-red-900/20 text-red-700 dark:text-red-400 rounded-xl border border-red-200 dark:border-red-800 font-semibold"></div>
    </div>

    <script>
        // ==========================================
        // 🛑 YAHAN APNI SUPABASE DETAILS DAAL 🛑
        // ==========================================
        const supabaseUrl = 'https://zkzfelzbcskmzgyfynjz.supabase.co'; 
        const supabaseKey = 'sb_publishable_TEvCsRbd9Zid9wYsbJDRSA_0Bw9qdhd';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        // --- UI & Theme Logic ---
        const themeToggle = document.getElementById('themeToggle');
        const htmlElement = document.documentElement;
        themeToggle.addEventListener('click', () => {
            htmlElement.classList.toggle('dark');
            themeToggle.innerHTML = htmlElement.classList.contains('dark') ? '☀️' : '🌙';
        });

        const showLoginBtn = document.getElementById('showLoginBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const loginSection = document.getElementById('loginSection');
        const mainApp = document.getElementById('mainApp');
        const continueGuestBtn = document.getElementById('continueGuestBtn');
        const authError = document.getElementById('authError');
        const modeStatus = document.getElementById('modeStatus');

        showLoginBtn.addEventListener('click', () => {
            loginSection.classList.remove('hidden');
            mainApp.classList.add('hidden');
        });

        continueGuestBtn.addEventListener('click', () => {
            loginSection.classList.add('hidden');
            mainApp.classList.remove('hidden');
        });

        // --- REAL AUTHENTICATION LOGIC ---
        async function checkUser() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (user) {
                modeStatus.innerHTML = `Logged in as: <span class="font-bold text-indigo-500">${user.email}</span>`;
                showLoginBtn.classList.add('hidden');
                logoutBtn.classList.remove('hidden');
                loginSection.classList.add('hidden');
                mainApp.classList.remove('hidden');
            } else {
                modeStatus.innerHTML = `Currently using: <span class="font-bold text-green-500">Guest Mode</span>`;
                showLoginBtn.classList.remove('hidden');
                logoutBtn.classList.add('hidden');
            }
        }

        // SIGN UP
        document.getElementById('signupSubmitBtn').addEventListener('click', async () => {
            const email = document.getElementById('emailInput').value;
            const password = document.getElementById('passwordInput').value;
            authError.classList.add('hidden');

            const { data, error } = await supabaseClient.auth.signUp({ email, password });
            if (error) {
                authError.innerText = "❌ " + error.message;
                authError.classList.remove('hidden');
            } else {
                alert("Account created successfully! You are now logged in.");
                checkUser();
            }
        });

        // LOG IN
        document.getElementById('loginSubmitBtn').addEventListener('click', async () => {
            const email = document.getElementById('emailInput').value;
            const password = document.getElementById('passwordInput').value;
            authError.classList.add('hidden');

            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) {
                authError.innerText = "❌ " + error.message;
                authError.classList.remove('hidden');
            } else {
                checkUser();
            }
        });

        // LOG OUT
        logoutBtn.addEventListener('click', async () => {
            await supabaseClient.auth.signOut();
            checkUser();
        });

        // Check login status on page load
        checkUser();

        // --- Evaluation API Logic ---
        document.getElementById("evaluateBtn").addEventListener("click", async () => {
            const topic = document.getElementById("topic").value.trim();
            const transcript = document.getElementById("transcript").value.trim();
            
            if (!topic || !transcript) {
                alert("Please provide both an interview topic and your answer transcript.");
                return;
            }

            const btn = document.getElementById("evaluateBtn");
            btn.disabled = true;
            btn.innerText = "Evaluating...";
            btn.classList.add("opacity-60");
            
            document.getElementById("loading").classList.remove("hidden");
            document.getElementById("resultBox").classList.add("hidden");

            try {
                // Modal API Endpoint
                const apiUrl = "https://unknown5112--interview-coach-v2-fastapi-app.us-east.modal.run/api/evaluate";
                const response = await fetch(apiUrl, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ topic, transcript })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.detail || "Server error occurred.");

                document.getElementById("scoreDisplay").innerText = data.evaluation.score;
                document.getElementById("feedbackDisplay").innerText = data.evaluation.feedback;
                document.getElementById("resultBox").classList.remove("hidden");
            } catch (error) {
                alert("Error: " + error.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "Evaluate My Answer";
                btn.classList.remove("opacity-60");
                document.getElementById("loading").classList.add("hidden");
            }
        });
    </script>
</body>
</html>
