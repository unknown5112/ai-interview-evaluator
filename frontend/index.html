<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Interview Evaluator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-2xl border border-gray-100">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-extrabold text-indigo-600 mb-2">AI Interview Coach 🚀</h1>
            <p class="text-gray-500">Practice your interview answers and get instant AI feedback.</p>
        </div>
        
        <div class="space-y-5">
            <div>
                <label class="block text-gray-700 font-bold mb-2">Interview Question / Topic:</label>
                <input type="text" id="topic" class="w-full p-4 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-gray-50" placeholder="e.g., Tell me about yourself">
            </div>
            
            <div>
                <label class="block text-gray-700 font-bold mb-2">Your Answer (Transcript):</label>
                <textarea id="transcript" rows="5" class="w-full p-4 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-gray-50" placeholder="Type or speak your answer here..."></textarea>
            </div>

            <button id="evaluateBtn" class="w-full bg-indigo-600 text-white font-bold text-lg py-4 rounded-xl hover:bg-indigo-700 transition duration-300 shadow-md">
                Evaluate My Answer
            </button>
        </div>

        <!-- Loading Spinner -->
        <div id="loading" class="hidden mt-6 text-center p-4 bg-indigo-50 rounded-xl">
            <p class="text-indigo-600 font-bold animate-pulse">⏳ AI is analyzing your response... Please wait.</p>
        </div>

        <!-- Results Section -->
        <div id="resultBox" class="hidden mt-8 p-6 bg-gradient-to-br from-green-50 to-emerald-50 rounded-xl border border-green-200 shadow-sm">
            <h2 class="text-xl font-bold text-gray-800 mb-4 flex items-center">
                📊 Evaluation Result
            </h2>
            <div class="flex items-center space-x-4 mb-4">
                <div class="w-20 h-20 rounded-full bg-green-500 text-white flex items-center justify-center text-3xl font-extrabold shadow-inner" id="scoreDisplay">
                    0
                </div>
                <span class="text-xl font-bold text-gray-700">Out of 10</span>
            </div>
            <div class="bg-white p-4 rounded-lg shadow-sm">
                <h3 class="font-bold text-gray-800 mb-1">Feedback:</h3>
                <p id="feedbackDisplay" class="text-gray-700 leading-relaxed"></p>
            </div>
        </div>
        
        <!-- Error Section -->
        <div id="errorBox" class="hidden mt-6 p-4 bg-red-50 text-red-700 rounded-xl border border-red-200 font-semibold">
        </div>
    </div>

    <script>
        document.getElementById("evaluateBtn").addEventListener("click", async () => {
            const topic = document.getElementById("topic").value.trim();
            const transcript = document.getElementById("transcript").value.trim();
            
            if (!topic || !transcript) {
                alert("Bhai, Topic aur Answer dono field bharna zaroori hai!");
                return;
            }

            // UI Update: Show loading state
            const btn = document.getElementById("evaluateBtn");
            btn.disabled = true;
            btn.innerText = "Evaluating...";
            btn.classList.add("opacity-60", "cursor-not-allowed");
            
            document.getElementById("loading").classList.remove("hidden");
            document.getElementById("resultBox").classList.add("hidden");
            document.getElementById("errorBox").classList.add("hidden");

            try {
                // EXACT NEW API URL
                const apiUrl = "https://unknown5112--interview-coach-v2-fastapi-app.us-east.modal.run/api/evaluate";
                
                const response = await fetch(apiUrl, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ topic, transcript })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || "Server error occurred.");
                }

                // Show Results
                document.getElementById("scoreDisplay").innerText = data.evaluation.score;
                document.getElementById("feedbackDisplay").innerText = data.evaluation.feedback;
                document.getElementById("resultBox").classList.remove("hidden");
            } catch (error) {
                document.getElementById("errorBox").innerText = "❌ Error: " + error.message;
                document.getElementById("errorBox").classList.remove("hidden");
            } finally {
                // Reset UI
                btn.disabled = false;
                btn.innerText = "Evaluate My Answer";
                btn.classList.remove("opacity-60", "cursor-not-allowed");
                document.getElementById("loading").classList.add("hidden");
            }
        });
    </script>
</body>
</html>
