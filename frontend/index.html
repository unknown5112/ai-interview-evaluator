<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Interview Evaluator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        defense: {
                            900: '#0f172a',
                            800: '#1e293b',
                            accent: '#3b82f6'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-defense-900 text-slate-200 min-h-screen font-sans antialiased selection:bg-defense-accent selection:text-white">

    <div class="max-w-4xl mx-auto px-4 py-12">
        
        <!-- Header -->
        <div class="text-center mb-12">
            <h1 class="text-4xl font-bold text-white mb-3 tracking-tight"><i class="fa-solid fa-microphone-lines text-defense-accent mr-3"></i>AI Mock Interview & Evaluator</h1>
            <p class="text-slate-400 text-lg">Practice your interview answers, speeches, and presentations with instant AI feedback.</p>
        </div>

        <!-- Main Card -->
        <div class="bg-defense-800 rounded-2xl shadow-2xl p-8 border border-slate-700">
            
            <!-- Input Area -->
            <div class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Interview Question / Topic</label>
                    <input type="text" id="topicInput" placeholder="e.g., Tell me about yourself, Future of AI, System Design..." 
                        class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-defense-accent focus:border-transparent transition">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Your Speech (Transcript)</label>
                    <textarea id="transcriptInput" rows="6" placeholder="Type or paste your spoken answer here..." 
                        class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-defense-accent focus:border-transparent transition resize-none"></textarea>
                </div>

                <button id="evaluateBtn" onclick="submitEvaluation()" 
                    class="w-full bg-defense-accent hover:bg-blue-600 text-white font-semibold py-4 px-6 rounded-lg shadow-lg hover:shadow-blue-500/30 transition-all duration-200 flex items-center justify-center gap-2">
                    <span>Evaluate Performance</span>
                    <i class="fa-solid fa-bolt"></i>
                </button>
            </div>

            <!-- Loading Spinner -->
            <div id="loadingIndicator" class="hidden mt-8 text-center text-slate-400 animate-pulse">
                <i class="fa-solid fa-circle-notch fa-spin text-3xl mb-2 text-defense-accent"></i>
                <p>AI is analyzing your response...</p>
            </div>

            <!-- Result Area -->
            <div id="resultArea" class="hidden mt-8 pt-8 border-t border-slate-700 opacity-0 transition-opacity duration-500">
                <h3 class="text-xl font-semibold text-white mb-6 flex items-center gap-2">
                    <i class="fa-solid fa-chart-pie text-defense-accent"></i> Evaluation Results
                </h3>
                
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <!-- Score Box -->
                    <div class="bg-slate-900 rounded-xl p-6 border border-slate-700 text-center flex flex-col justify-center">
                        <p class="text-slate-400 text-sm uppercase tracking-wider mb-2">Overall Score</p>
                        <div class="text-5xl font-bold text-white"><span id="scoreValue" class="text-defense-accent">--</span><span class="text-2xl text-slate-500">/10</span></div>
                    </div>
                    
                    <!-- Feedback Box -->
                    <div class="bg-slate-900 rounded-xl p-6 border border-slate-700 md:col-span-2">
                        <p class="text-slate-400 text-sm uppercase tracking-wider mb-2">AI Feedback</p>
                        <p id="feedbackText" class="text-slate-300 leading-relaxed">Waiting for evaluation...</p>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        // 🔥 Ninja Ping: Wakes up the server silently when the page loads
        window.onload = () => {
            fetch("https://unknown5112--ai-interview-evaluator-fastapi-app.modal.run/docs")
                .catch(() => console.log("Server warming up in background..."));
        };

        async function submitEvaluation() {
            const topic = document.getElementById('topicInput').value;
            const transcript = document.getElementById('transcriptInput').value;
            
            if(!topic || !transcript) {
                alert("Please provide both a topic/question and your transcript.");
                return;
            }

            document.getElementById('evaluateBtn').disabled = true;
            document.getElementById('evaluateBtn').classList.add('opacity-50', 'cursor-not-allowed');
            document.getElementById('resultArea').classList.add('hidden', 'opacity-0');
            document.getElementById('loadingIndicator').classList.remove('hidden');

            const modalApiUrl = "https://unknown5112--ai-interview-evaluator-fastapi-app.modal.run/api/evaluate";

            try {
                const response = await fetch(modalApiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ topic: topic, transcript: transcript })
                });

                if(!response.ok) throw new Error("Server error occurred!");

                const data = await response.json();
                
                document.getElementById('scoreValue').innerText = data.evaluation.score;
                document.getElementById('feedbackText').innerText = data.evaluation.feedback;
                
                document.getElementById('loadingIndicator').classList.add('hidden');
                document.getElementById('resultArea').classList.remove('hidden');
                setTimeout(() => document.getElementById('resultArea').classList.remove('opacity-0'), 50);

            } catch (error) {
                alert("Error: " + error.message);
                document.getElementById('loadingIndicator').classList.add('hidden');
            } finally {
                document.getElementById('evaluateBtn').disabled = false;
                document.getElementById('evaluateBtn').classList.remove('opacity-50', 'cursor-not-allowed');
            }
        }
    </script>
</body>
</html>
